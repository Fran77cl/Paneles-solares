name: Alerta Carga EV Fin de Semana

on:
  schedule:
    # 14:00 UTC equivale a las 11:00 hrs en Santiago (UTC-3)
    # Corre exclusivamente sábados y domingos (6,0)
    - cron: '0 14 * * 6,0'
  workflow_dispatch:

jobs:
  alert-weekend-ev:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar recordatorio a Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MENSAJE="🚗☀️ *Recordatorio Carga Solar Fin de Semana*

          • *Estado:* Inició la ventana óptima en Pudahuel (>3,5 kW FV).
          • *Acción:* Enchufar el auto a 16 A (~3,5 kW) o con cargador de 7 kW.
          • *Horario recomendado:* 11:00 a 16:30 hrs.
          • *Costo de recarga:* \$0 CLP (absorbiendo excedentes antes de Punta)."

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MENSAJE}" \
            -d "parse_mode=Markdown"
            
